<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fight Club Ps Store</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* تصميم كارت المتجر البرمجي */
      .store-card {
        max-width: 380px;
        margin: 40px auto 20px;
        padding: 22px 18px;
        background: linear-gradient(145deg, #131822, #0d1017);
        border: 1px solid #232d3b;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      }
      .store-title {
        color: #e6ebf2;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 0 0 12px rgba(127, 208, 160, 0.3);
      }
      .store-sub {
        color: #7fd0a0;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        direction: rtl;
      }
      .store-info {
        color: #8b95a3;
        font-size: 13px;
        margin-bottom: 6px;
        direction: rtl;
      }
      .store-phone {
        display: inline-block;
        margin-top: 10px;
        padding: 6px 16px;
        background: rgba(127, 208, 160, 0.1);
        color: #7fd0a0;
        border: 1px solid rgba(127, 208, 160, 0.25);
        border-radius: 20px;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        bottom: 40px;
        left: 50%;
        width: 42px;
        height: 42px;
        margin-left: -21px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        bottom: 45px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 15px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log .store-card {
        display: none;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>Fight Club Ps Store</b></div>

    <!-- كارت المتجر الأنيق -->
    <div class="store-card">
      <div class="store-title">Fight Club Ps Store</div>
      <div class="store-sub">لجميع خدمات البلايستيشن</div>
      <div class="store-info">بلبيس - حي الزهور</div>
      <div class="store-phone">01015505669</div>
    </div>

    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
