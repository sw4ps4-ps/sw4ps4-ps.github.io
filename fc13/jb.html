<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fight Club Ps Store</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #000000 url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #ffffff;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 12px 10px;
        background: rgba(0, 0, 0, 0.90);
        border-bottom: 2px solid #334155;
      }
      #brand b {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      #status-box {
        position: fixed;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.94);
        border: 2px solid #3b82f6;
        padding: 25px 35px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        min-width: 320px;
      }

      #fw-info {
        font-size: 17px;
        font-weight: 800;
        color: #facc15;
        background: rgba(0, 0, 0, 0.7);
        padding: 6px 14px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 15px;
        border: 1px solid #eab308;
      }

      #wait-msg {
        font-size: 19px;
        font-weight: 700;
        color: #60a5fa;
        margin-bottom: 15px;
        line-height: 1.4;
      }

      #sub-msg {
        font-size: 14px;
        color: #e2e8f0;
      }

      #spin {
        width: 45px;
        height: 45px;
        margin: 15px auto 0;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: 45%;
        left: 0; right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        display: none;
      }
      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; color: #f87171; }

      body.log #spin, body.log #msg, body.log #status-box { display: none; }
      body.log #wrap { padding: 20px; }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 10px;
        color: #60a5fa;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.5 Consolas, monospace;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 15px;
        height: calc(100vh - 150px);
        overflow-y: auto;
        color: #f8fafc;
        box-shadow: 0 8px 25px rgba(0,0,0,0.9);
      }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      .warn { color: #facc15; }
    </style>
  </head>
  <body>
    <div id="brand"><b>Fight Club Ps Store</b></div>

    <div id="status-box">
      <div id="fw-info">System Firmware: <span id="fw-ver">Detecting...</span></div>
      <div id="wait-msg">Please wait...<br>Running Exploit</div>
      <div id="sub-msg">Do not close browser until complete</div>
      <div id="spin"></div>
    </div>

    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      (function detectFW() {
        let ua = navigator.userAgent;
        let match = ua.match(/PlayStation 4 ([0-9\.]+)/) || ua.match(/PlayStation 5 ([0-9\.]+)/);
        if (match) {
          document.getElementById('fw-ver').textContent = 'v' + match[1];
        } else {
          document.getElementById('fw-ver').textContent = 'PS Console';
        }
      })();
    </script>
    <script type="module">
      import "./jb.js?v=12";
    </script>
  </body>
</html>
