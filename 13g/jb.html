<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fight Club Ps Store</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080002 url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle, rgba(15, 0, 5, 0.5) 0%, rgba(5, 0, 2, 0.88) 100%);
        z-index: 1;
      }

      .card {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        background: rgba(18, 10, 14, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 30, 66, 0.35);
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 30, 66, 0.2);
        padding: 28px 24px;
        text-align: center;
      }

      #brand {
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      #brand h1 {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(255, 30, 66, 0.9);
        margin: 0;
        text-transform: uppercase;
      }
      #brand span {
        font-size: 12px;
        color: #ff4d6d;
        letter-spacing: 3px;
        display: block;
        margin-top: 5px;
        font-weight: 600;
      }

      .fw-info {
        background: rgba(255, 30, 66, 0.12);
        border: 1px solid rgba(255, 30, 66, 0.35);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        color: #e0e0e0;
        margin-bottom: 20px;
      }
      .fw-info b { color: #ff1e42; }

      #spin {
        width: 50px;
        height: 50px;
        margin: 15px auto;
        border: 4px solid rgba(255, 30, 66, 0.2);
        border-top-color: #ff1e42;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(255, 30, 66, 0.4);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .wait-banner {
        margin-top: 15px;
        font-size: 15px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.5px;
      }
      .sub-msg {
        font-size: 13px;
        color: #ff4d6d;
        margin-top: 6px;
      }

      #msg {
        display: none;
        font-size: 16px;
        color: #ff4757;
        margin-top: 15px;
        font-weight: bold;
      }

      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin, body.done .wait-banner, body.done .sub-msg { display: none; }
      body.fail #spin, body.fail .sub-msg { display: none; }
      body.fail #msg { display: block; }

      /* الوضع الخاص بالـ Log عند الطلب */
      body.log .card { display: none; }
      body.log #wrap {
        position: relative;
        z-index: 2;
        width: 90%;
        margin: auto;
        padding: 20px;
      }
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(10, 10, 10, 0.9);
        border: 1px solid rgba(255, 30, 66, 0.4);
        border-radius: 8px;
        padding: 12px;
        height: 70vh;
        overflow-y: auto;
        color: #00ffcc;
        direction: ltr;
        text-align: left;
      }
      .ok { color: #2ecc71; }
      .bad { color: #ff4757; }
      .warn { color: #ffa502; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="brand">
        <h1>FIGHT CLUB PS STORE</h1>
        <span>EXPLOIT ENGINE SYSTEM</span>
      </div>

      <div class="fw-info" id="fw-display">
        برمجيات النظام: <b id="fw-val">جاري التعرف...</b>
      </div>

      <div id="spin"></div>

      <div class="wait-banner">جاري معالجة الثغرة والتعديل...</div>
      <div class="sub-msg">يرجى الانتظار وعدم إغلاق المتصفح حتى انتهاء العملية</div>

      <div id="msg">حدث خطأ أثناء التشغيل، يرجى إعادة المحاولة.</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      (function() {
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        var fwVal = document.getElementById("fw-val");
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = "0" + ms;
          fwVal.textContent = "PS4 FW " + m[1] + "." + ms;
        } else {
          fwVal.textContent = "PS4 FW (إصدار مخصص)";
        }
      })();
    </script>
    <script src="int64.js"></script>
    <script src="ps4_offsets.js"></script>
    <script src="mem.js"></script>
    <script src="core.js?v=10"></script>
    <script src="jb.js?v=10"></script>
  </body>
</html>
