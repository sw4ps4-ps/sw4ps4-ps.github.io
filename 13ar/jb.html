<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fight Club Ps Store</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #000000 url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #ffffff;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 12px 10px;
        background: rgba(0, 0, 0, 0.90);
        border-bottom: 2px solid #334155;
      }
      #brand b {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      #status-box {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.95);
        border: 2px solid #3b82f6;
        padding: 25px 35px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        min-width: 320px;
      }

      #fw-info {
        font-size: 18px;
        font-weight: 800;
        color: #facc15;
        background: rgba(0, 0, 0, 0.85);
        padding: 6px 16px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 15px;
        border: 1px solid #eab308;
        box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
      }

      #wait-msg {
        font-size: 19px;
        font-weight: 700;
        color: #60a5fa;
        margin-bottom: 10px;
        line-height: 1.4;
      }

      #sub-msg {
        font-size: 14px;
        color: #e2e8f0;
      }

      #spin {
        width: 45px;
        height: 45px;
        margin: 15px auto 0;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #err-log {
        display: none;
        margin-top: 15px;
        color: #f87171;
        font-size: 13px;
        background: rgba(0,0,0,0.7);
        padding: 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>Fight Club Ps Store</b></div>

    <div id="status-box">
      <div id="fw-info">PS4 Firmware: <span id="fw-ver">Detecting...</span></div>
      <div id="wait-msg">Please wait...<br>Running Exploit</div>
      <div id="sub-msg">Do not close browser until complete</div>
      <div id="spin"></div>
      <div id="err-log"></div>
    </div>

    <script>
      function getPS4Version() {
        let ua = navigator.userAgent;
        let pos = ua.indexOf('PlayStation 4');
        if (pos !== -1) {
          let ver = ua.substring(pos + 14, pos + 19).trim();
          return 'v' + ver;
        }
        let match = ua.match(/PlayStation 4[\/\s]([0-9\.]+)/i);
        if (match && match[1]) return 'v' + match[1];
        return 'PS4 FW Unknown';
      }

      document.getElementById('fw-ver').textContent = getPS4Version();

      // Catch Module Loading Errors
      window.addEventListener('error', function(e) {
        let log = document.getElementById('err-log');
        log.style.display = 'block';
        log.textContent = 'Error: ' + (e.message || 'Failed to load script');
      });
    </script>
    
    <!-- Loading as Module -->
    <script type="module" src="jb.js"></script>
  </body>
</html>
