<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Club Ps Store</title>
<style>
  html, body { 
    margin:0; 
    padding:0; 
    min-height: 100vh;
    background: #000000 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif; 
  }
  #brand { 
    text-align: center; 
    padding: 12px 10px; 
    background: rgba(0, 0, 0, 0.90);
    border-bottom: 2px solid #334155; 
  }
  #brand b { 
    font-size: 20px; 
    font-weight: 700; 
    letter-spacing: 0.15em;
    color: #ffffff; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }
  #wrap { 
    padding: 25px; 
    max-width: 550px;
    margin: 40px auto;
    background: rgba(15, 23, 42, 0.93);
    border: 1px solid #475569;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: center;
  }
  #state { 
    font-size: 24px; 
    font-weight: 700; 
    margin-bottom: 15px;
    color: #60a5fa; 
  }
  #det { 
    font-size: 15px; 
    color: #f1f5f9; 
    margin-bottom: 15px; 
    line-height: 1.6;
  }
  #bar-container {
    width: 100%;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
    border: 1px solid #334155;
    height: 18px;
  }
  #bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    border-radius: 8px;
    transition: width 0.3s ease;
  }
  #cache { 
    font-size: 16px; 
    font-weight: 600;
    color: #facc15; 
    margin-top: 15px; 
    padding: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #334155;
    border-radius: 6px;
  }
  #cache.cacheok { 
    color: #4ade80; 
    border-color: #22c55e;
  }
  .btn-continue {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    background: #2563eb;
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
  }
</style>
</head>
<body>
<div id="brand"><b>Fight Club Ps Store</b></div>

<div id="wrap">
  <div id="state">حالة التخزين المؤقت (Offline Cache)</div>
  <div id="det">جاري التحقق من ملفات الكاش...</div>
  
  <div id="bar-container">
    <div id="bar"></div>
  </div>

  <div id="cache">جاري تهيئة الكاش...</div>
  <div id="actions"></div>
</div>

<script>
  const cacheStatus = document.getElementById('cache');
  const det = document.getElementById('det');
  const actions = document.getElementById('actions');
  const progressBar = document.getElementById('bar');

  if (window.applicationCache) {
    const appCache = window.applicationCache;

    appCache.addEventListener('checking', function() {
      cacheStatus.textContent = 'جاري البحث عن تحديثات...';
      progressBar.style.width = '15%';
    }, false);

    appCache.addEventListener('downloading', function() {
      cacheStatus.textContent = 'جاري تحفيط الملفات للاستخدام بدون إنترنت...';
      det.innerHTML = '<b>يرجى الانتظار:</b> جاري حفظ أوفلاين.';
      progressBar.style.width = '40%';
    }, false);

    appCache.addEventListener('progress', function(e) {
      if (e.lengthComputable) {
        let perc = Math.round((e.loaded / e.total) * 100);
        cacheStatus.textContent = 'جاري التحميل: ' + perc + '%';
        progressBar.style.width = perc + '%';
      }
    }, false);

    appCache.addEventListener('cached', function() {
      progressBar.style.width = '100%';
      cacheStatus.className = 'cacheok';
      cacheStatus.innerHTML = 'تم الكاش بنجاح!<br>قم بإغلاق المتصفح وفصل الإنترنت الآن.';
      det.innerHTML = 'الصفحة جاهزة تماماً للعمل <b>أوفلاين</b>.';
      actions.innerHTML = '<a href="jb.html" class="btn-continue">الانتقال للتعديل الآن</a>';
    }, false);

    appCache.addEventListener('noupdate', function() {
      progressBar.style.width = '100%';
      cacheStatus.className = 'cacheok';
      cacheStatus.textContent = 'تم التخزين أوفلاين مسبقاً (جاهز العمل)';
      det.innerHTML = 'جاري التحويل لصفحة التعديل...';
      setTimeout(() => { window.location.href = 'jb.html'; }, 1200);
    }, false);

    appCache.addEventListener('error', function() {
      if (!navigator.onLine) {
        progressBar.style.width = '100%';
        cacheStatus.className = 'cacheok';
        cacheStatus.textContent = 'الوضع أوفلاين جاهز';
        det.innerHTML = 'جاري الدخول لصفحة التعديل...';
        setTimeout(() => { window.location.href = 'jb.html'; }, 1000);
      } else {
        cacheStatus.textContent = 'حدث خطأ أثناء الكاش!';
        cacheStatus.style.color = '#f87171';
        actions.innerHTML = '<a href="jb.html" class="btn-continue">المتابعة للتعديل على أي حال</a>';
      }
    }, false);
  } else {
    cacheStatus.textContent = 'المتصفح لا يدعم AppCache';
  }
</script>
</body>
</html>
