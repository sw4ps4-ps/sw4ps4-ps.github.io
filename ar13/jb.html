      /* تصميم كارت المتجر البرمجي */
      .store-card {
        max-width: 380px;
        margin: 40px auto 20px;
        padding: 22px 18px;
        background: rgba(19, 24, 34, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(35, 45, 59, 0.8);
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      }
      .store-title {
        color: #e6ebf2;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 0 0 12px rgba(127, 208, 160, 0.3);
      }
      .store-sub {
        color: #7fd0a0;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        direction: rtl;
      }
      .store-info {
        color: #8b95a3;
        font-size: 13px;
        margin-bottom: 6px;
        direction: rtl;
      }
      .store-phone {
        display: inline-block;
        margin-top: 10px;
        padding: 6px 16px;
        background: rgba(127, 208, 160, 0.15);
        color: #7fd0a0;
        border: 1px solid rgba(127, 208, 160, 0.35);
        border-radius: 20px;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        bottom: 40px;
        left: 50%;
        width: 42px;
        height: 42px;
        margin-left: -21px;
        border: 4px solid rgba(30, 39, 50, 0.8);
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        bottom: 45px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 15px;
        letter-spacing: 0.5px;
        display: none;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
