<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Fight Club PS Store - PS5 Host</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #080808; color: #ffffff; margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        h1 { color: #e50914; margin: 5px 0; font-size: 26px; text-shadow: 0 0 12px rgba(229, 9, 20, 0.6); text-align: center; }
        .subtitle { color: #8c8c8c; margin-bottom: 15px; font-size: 13px; text-align: center; }

        /* مربع معلومات المحل الفخم والمضيء */
        .store-badge {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.25), inset 0 0 10px rgba(229, 9, 20, 0.1);
            border-radius: 10px; padding: 10px 20px; margin-bottom: 20px;
            text-align: center; max-width: 600px; width: 100%;
        }
        .store-badge h3 { color: #ff334b; margin: 0 0 5px 0; font-size: 16px; letter-spacing: 1px; }
        .store-badge p { margin: 3px 0; color: #d1d1d1; font-size: 13px; }

        #console {
            background: #111111; border: 1px solid #222; border-radius: 8px;
            width: 100%; max-width: 850px; height: 160px; padding: 12px;
            overflow-y: auto; font-family: monospace; font-size: 12px; color: #00ff66;
            box-shadow: inset 0 0 10px #000; margin-bottom: 15px; text-align: left; direction: ltr;
        }
        .section-title { color: #aaa; font-size: 14px; margin: 10px 0 8px 0; border-bottom: 1px solid #222; width: 100%; max-width: 850px; padding-bottom: 4px; }
        .btn-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 850px; margin-bottom: 12px; }
        .btn {
            background: #181818; color: #fff; border: 1px solid #333; padding: 8px 14px;
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn:hover, .btn:focus { background: #e50914; border-color: #e50914; box-shadow: 0 0 10px rgba(229, 9, 20, 0.5); transform: translateY(-2px); }
        .btn-main { background: linear-gradient(135deg, #2a080a, #4a0d11); border-color: #e50914; font-size: 14px; padding: 10px 20px; }
    </style>
</head>
<body>

    <h1>Fight Club PS Store</h1>
    <div class="subtitle">PS5 Advanced Exploit & Payload Host</div>

    <div class="store-badge">
        <h3>Fight Club PS Store</h3>
        <p>لجميع خدمات البلاي ستيشن</p>
        <p>📍  بلبيس حي الزهور | 📞 [ 01015505669 ]</p>
    </div>

    <div id="console"></div>

    <div class="btn-grid">
        <button class="btn btn-main" onclick="loadPayloadSequence(['kstuff', 'shadowmountplus', 'onionhen'])">
            🚀 [اضغط R2 بالدراع] لتشغيل الالعاب  (Kstuff + Shadow + OnionHEN)
        </button>
    </div>

    <div class="section-title">Payload</div>

    <!-- الأزرار الاختيارية مطابقة لأسماء الملفات في مجلد payloads تماماً -->
    <div class="btn-grid">
        <button class="btn" onclick="loadPayload('etaHEN')">etaHEN</button>
        <button class="btn" onclick="loadPayload('web-file-mgr-v1.12')">Web File Manager</button>
        <button class="btn" onclick="loadPayload('ftpsrv-ps5-install')">FTP Server</button>
        <button class="btn" onclick="loadPayload('nanodns')">NanoDNS</button>
        <button class="btn" onclick="loadPayload('pldmgr_v0.6.3')">Payload Manager</button>
        <button class="btn" onclick="loadPayload('PoorDS4')">PoorDS4</button>
        <button class="btn" onclick="loadPayload('PoorDS4-status')">PoorDS4 Status</button>
        <button class="btn" onclick="loadPayload('PoorDS4-stop')">PoorDS4 Stop</button>
        <button class="btn" onclick="loadPayload('webkit-autoloader-installer_v0.6.1')">Autoloader Installer</button>
    </div>

    <script src="./src/firmware.js"></script>
    <script src="./src/main.js"></script>
    <script src="./src/rop.js"></script>
    <script src="./src/utils/syscalls.js"></script>
    <script type="module" src="./src/site.js"></script>
</body>
</html>
