<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Club Ps Store</title>
<style>
  html, body { 
    margin:0; 
    padding:0; 
    min-height: 100vh;
    background: #000000 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif; 
  }
  #brand { 
    text-align: center; 
    padding: 12px 10px; 
    background: rgba(0, 0, 0, 0.90);
    border-bottom: 2px solid #334155; 
  }
  #brand b { 
    font-size: 20px; 
    font-weight: 700; 
    letter-spacing: 0.15em;
    color: #ffffff; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }
  #wrap { 
    padding: 25px; 
    max-width: 550px;
    margin: 40px auto;
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid #475569;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: center;
  }
  #fw-info {
    font-size: 18px;
    font-weight: 800;
    color: #facc15;
    background: rgba(0, 0, 0, 0.85);
    padding: 8px 18px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 15px;
    border: 1px solid #eab308;
    box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
  }
  #state { 
    font-size: 22px; 
    font-weight: 700; 
    margin-bottom: 15px;
    color: #60a5fa; 
  }
  #det { 
    font-size: 15px; 
    color: #f1f5f9; 
    margin-bottom: 15px; 
    line-height: 1.6;
  }
  #bar-container {
    width: 100%;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
    border: 1px solid #334155;
    height: 16px;
  }
  #bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    border-radius: 8px;
    transition: width 0.3s ease;
  }
  #cache { 
    font-size: 16px; 
    font-weight: 600;
    color: #facc15; 
    margin-top: 15px; 
    padding: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #334155;
    border-radius: 6px;
  }
  #cache.cacheok { 
    color: #4ade80; 
    border-color: #22c55e;
  }
  .btn-continue {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    background: #2563eb;
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
  }
</style>
</head>
<body>
<div id="brand"><b>Fight Club Ps Store</b></div>

<div id="wrap">
  <div id="fw-info">PS4 Firmware: <span id="fw-ver">Detecting...</span></div>
  <div id="state">Offline Storage Status</div>
  <div id="det">Preparing offline system...</div>
  
  <div id="bar-container">
    <div id="bar"></div>
  </div>

  <div id="cache">Registering Service Worker...</div>
  <div id="actions"></div>
</div>

<script>
  function getPS4Version() {
    let ua = navigator.userAgent;
    let pos = ua.indexOf('PlayStation 4');
    if (pos !== -1) {
      let ver = ua.substring(pos + 14, pos + 19).trim();
      return 'v' + ver;
    }
    let match = ua.match(/PlayStation 4[\/\s]([0-9\.]+)/i);
    if (match && match[1]) return 'v' + match[1];
    return 'PS4 FW Unknown';
  }

  document.getElementById('fw-ver').textContent = getPS4Version();

  const cacheStatus = document.getElementById('cache');
  const det = document.getElementById('det');
  const progressBar = document.getElementById('bar');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      progressBar.style.width = '50%';
      cacheStatus.textContent = 'Downloading Exploit Files...';
      
      let worker = reg.installing || reg.waiting || reg.active;
      if (worker) {
        worker.addEventListener('statechange', (e) => {
          if (e.target.state === 'activated') {
            progressBar.style.width = '100%';
            cacheStatus.className = 'cacheok';
            cacheStatus.innerHTML = 'Caching Complete! 100%';
            det.innerHTML = 'Page is fully saved for <b>Offline Use</b>.';
            document.getElementById('actions').innerHTML = '<a href="jb.html" class="btn-continue">Launch Exploit Now</a>';
          }
        });
      }
      if (reg.active) {
        progressBar.style.width = '100%';
        cacheStatus.className = 'cacheok';
        cacheStatus.innerHTML = 'Offline Cache Ready!';
        det.innerHTML = 'Page is ready for <b>Offline Use</b>.';
        document.getElementById('actions').innerHTML = '<a href="jb.html" class="btn-continue">Launch Exploit Now</a>';
      }
    }).catch((err) => {
      cacheStatus.textContent = 'SW Error: ' + err.message;
    });
  } else {
    cacheStatus.textContent = 'Service Worker Not Supported!';
  }
</script>
</body>
</html>
