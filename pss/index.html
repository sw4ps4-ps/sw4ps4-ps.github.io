<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيت الألعاب - PS Host</title>
<style>
  * { box-sizing: border-box; }
  html, body { 
    margin:0; 
    padding:0; 
    min-height: 100vh;
    background: #080b11 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23080b11"/><circle cx="50" cy="50" r="40" fill="none" stroke="%2300f0ff" stroke-opacity="0.03" stroke-width="1"/></svg>'); 
    color:#c8ced8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 90%;
    max-width: 480px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(0, 240, 255, 0.1);
    text-align: center;
    margin: 20px auto;
  }

  /* Header / Branding */
  .brand-title {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    margin: 0 0 4px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    letter-spacing: 1px;
  }
  .brand-sub {
    font-size: 11px;
    color: #00f0ff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .services {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  /* Core UI */
  #wrap { margin-bottom: 18px; }
  #state { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  #det { font-size: 13px; color: #8b95a3; margin-bottom: 6px; }
  #det b { color: #c8ced8; font-weight: 600; }
  #cache { font-size: 12px; color: #5c6672; min-height: 14px; }
  #cache.cacheok { color: #38bdf8; }

  /* Info Footer */
  .contacts {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 14px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .contact-item span { color: #00f0ff; font-weight: bold; display: block; margin-bottom: 2px; }
  .address {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 10px;
    line-height: 1.4;
  }

  .ok { color:#38bdf8; } .bad { color:#f87171; } .warn { color:#fbbf24; }
</style>
</head>
<body>

<div class="container">
  <div class="brand-title">بيت الألعاب</div>
  <div class="brand-sub">GAMING STORE</div>
  <div class="services">GAMES • CONSOLES • ACCESSORIES • AND MORE</div>

  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

  <div class="contacts">
    <div class="contact-item">
      <span>واتساب</span>
      0508390706
    </div>
    <div class="contact-item">
      <span>إتصال</span>
      065757223
    </div>
  </div>

  <div class="address">
    <b>العنوان:</b> عجمان المويهات 2 - شارع الشيخ عمار مقابل سالم مول
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
