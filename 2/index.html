<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fight Club PS Store</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh;
    background: #080002 url('bg.jpg') no-repeat center center fixed;
    background-size: cover; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 90%; max-width: 480px;
    background: rgba(18, 10, 14, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 30, 66, 0.4);
    border-radius: 16px;
    padding: 24px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  h1 { font-size: 24px; color: #fff; text-shadow: 0 0 10px #ff1e42; }
  span.sub { font-size: 11px; color: #ff4d6d; letter-spacing: 2px; display: block; margin-bottom: 15px; }
  .badge { background: rgba(255, 30, 66, 0.15); border: 1px solid rgba(255, 30, 66, 0.3); border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 15px; }
  .badge b { color: #ff1e42; }
  #state { font-size: 16px; font-weight: bold; margin: 10px 0; }
  #cache { font-size: 12px; color: #aaa; margin-top: 8px; }
  .ok { color: #2ecc71; }
  .warn { color: #ffa502; }
  .bad { color: #ff4757; }
</style>
</head>
<body>

<div class="card">
  <h1>FIGHT CLUB PS STORE</h1>
  <span class="sub">SYSTEM HOST EXPLOIT</span>
  <div class="badge" id="det">Checking System Firmware...</div>
  <div id="state">Checking Cache...</div>
  <div id="cache">Initializing offline cache...</div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t) { cacheEl.textContent = t; }

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var params = new URLSearchParams(location.search);
    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "Firmware: <b>" + (key || "Unknown") + "</b> &middot; " + (supported ? "<b class='ok'>Supported ✓</b>" : "<b class='bad'>Unsupported</b>");

    var target = "jb.html" + location.search;
    function go() { setState("Launching Jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        waitForTap("Unsupported FW (" + (key || "unknown") + ") -- Press X to continue anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine || ac.status === ac.IDLE) {
        setCache("Cached for offline use ✓");
        waitForTap("CACHED -- Press X or tap to run", go);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Cache updated.");
        waitForTap("Update ready -- Press X to reload", function () { location.reload(); });
    } else {
        ac.addEventListener("cached", function () {
            setCache("Cached for offline use ✓");
            waitForTap("CACHED (first run) -- Press X or tap to run", go);
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("Cached for offline use ✓");
            waitForTap("CACHED -- Press X or tap to run", go);
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache error encountered.");
            waitForTap("Cache Error -- Press X to proceed", go);
        }, false);
    }
})();
</script>
</body>
</html>
