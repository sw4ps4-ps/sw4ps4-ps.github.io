<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Club Ps Store</title>
<style>
  html, body { 
    margin:0; 
    padding:0; 
    min-height: 100vh;
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color:#c8ced8;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif; 
  }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { 
    text-align:center; 
    padding:8px 10px; 
    background: rgba(14, 17, 22, 0.85);
    border-bottom:1px solid #1e2732; 
  }
  #brand b { 
    font-size:15px; 
    font-weight:700; 
    letter-spacing:.14em;
    color:#e6ebf2; 
    vertical-align:middle; 
  }
</style>
</head>
<body>
<div id="brand"><b>Fight Club Ps Store</b></div>
</body>
</html>
