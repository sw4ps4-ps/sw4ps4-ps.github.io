<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Club Ps Store</title>
<style>
  html, body { 
    margin:0; 
    padding:0; 
    min-height: 100vh;
    background: #000000 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif; 
  }
  #brand { 
    text-align: center; 
    padding: 12px 10px; 
    background: rgba(0, 0, 0, 0.85);
    border-bottom: 2px solid #334155; 
  }
  #brand b { 
    font-size: 18px; 
    font-weight: 700; 
    letter-spacing: 0.15em;
    color: #ffffff; 
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
  }
  #wrap { 
    padding: 20px; 
    max-width: 600px;
    margin: 40px auto;
    background: rgba(15, 23, 42, 0.90);
    border: 1px solid #334155;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    text-align: center;
  }
  #state { 
    font-size: 24px; 
    font-weight: 700; 
    margin-bottom: 12px;
    color: #60a5fa; 
  }
  #det { 
    font-size: 14px; 
    color: #e2e8f0; 
    margin-bottom: 10px; 
  }
  #det b { color: #ffffff; }
  #cache { 
    font-size: 15px; 
    font-weight: 600;
    color: #facc15; 
    margin-top: 15px; 
    padding: 8px;
    background: rgba(0,0,0,0.4);
    border-radius: 5px;
  }
  #cache.cacheok { 
    color: #4ade80; 
  }
  .ok { color: #4ade80; } 
  .bad { color: #f87171; } 
  .warn { color: #facc15; }
</style>
</head>
<body>
<div id="brand"><b>Fight Club Ps Store</b></div>

<div id="wrap">
  <div id="state">Caching Status</div>
  <div id="det">Checking offline cache files...</div>
  <div id="cache">Initializing Application Cache...</div>
</div>

<script>
  const cacheStatus = document.getElementById('cache');
  const det = document.getElementById('det');

  if (window.applicationCache) {
    const appCache = window.applicationCache;

    appCache.addEventListener('checking', function() {
      cacheStatus.textContent = 'Checking for updates...';
    }, false);

    appCache.addEventListener('downloading', function() {
      cacheStatus.textContent = 'Downloading cache files...';
      det.innerHTML = '<b>Please wait:</b> Saving exploit offline.';
    }, false);

    appCache.addEventListener('progress', function(e) {
      if (e.lengthComputable) {
        cacheStatus.textContent = 'Downloading: ' + Math.round((e.loaded / e.total) * 100) + '%';
      }
    }, false);

    appCache.addEventListener('cached', function() {
      cacheStatus.textContent = 'Cached Successfully!';
      cacheStatus.className = 'cacheok';
      det.innerHTML = 'Page is ready for <b>Offline Use</b>.';
      setTimeout(() => { window.location.href = 'jb.html'; }, 2000);
    }, false);

    appCache.addEventListener('noupdate', function() {
      cacheStatus.textContent = 'Already Cached (Offline Ready)';
      cacheStatus.className = 'cacheok';
      setTimeout(() => { window.location.href = 'jb.html'; }, 1500);
    }, false);

    appCache.addEventListener('error', function() {
      cacheStatus.textContent = 'Cache Failed or Offline';
      cacheStatus.style.color = '#f87171';
    }, false);
  } else {
    cacheStatus.textContent = 'AppCache not supported by this browser';
  }
</script>
</body>
</html>
